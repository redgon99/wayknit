<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<style>
:root {
  --c-primary:#0f172a; --c-accent:#facc15; --c-accent-soft:#fffbeb; --c-amber:#a16207;
  --c-text:#0f172a; --c-text2:#475569; --c-muted:#64748b; --c-tertiary:#94a3b8;
  --c-border:rgba(15,23,42,.08); --c-border-strong:rgba(15,23,42,.14); --c-bg2:#f1f5f9; --c-surface:#fff;
  --r-sm:8px; --r-lg:14px; --r-pill:99px;
  --sh-sm:0 1px 3px rgba(15,23,42,.1); --sh-panel:0 8px 32px rgba(15,23,42,.12);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Instrument Sans','Noto Sans KR',system-ui,sans-serif; }
a { color:#ca8a04; } a:hover { color:#a16207; }
.phone { position:relative; width:390px; height:844px; overflow:hidden; background:#eef3f0; }
.map-bg { position:absolute; inset:0; background:
  radial-gradient(ellipse 480px 340px at 74% 20%, rgba(196,225,214,.9), transparent 60%),
  radial-gradient(ellipse 420px 300px at 12% 50%, rgba(206,232,221,.85), transparent 55%),
  linear-gradient(160deg,#e3efe8 0%,#dcebe3 40%,#d7e7de 100%); }

.top { position:absolute; left:14px; right:14px; top:14px; z-index:5; display:flex; flex-direction:column; gap:8px; }
.top-row1 { display:flex; gap:8px; align-items:center; }
.trip-chip { flex:1; min-width:0; display:flex; align-items:center; gap:4px; background:#fff; border:1px solid var(--c-border);
  border-radius:var(--r-pill); padding:10px 8px 10px 16px; box-shadow:var(--sh-panel); }
.trip-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; color:var(--c-text); }
.top-row2 { display:flex; align-items:center; gap:8px; }
.days { flex:1; min-width:0; display:flex; gap:6px; overflow:hidden; }
.daytab { flex-shrink:0; border:none; border-radius:var(--r-pill); padding:7px 14px; font-size:12.5px; font-weight:600;
  background:rgba(255,255,255,.94); color:var(--c-muted); box-shadow:var(--sh-sm); white-space:nowrap; font-family:inherit; }
.daytab.active { background:var(--c-primary); color:#fff; }
.tools { flex-shrink:0; display:flex; gap:6px; }
.tool-btn { flex-shrink:0; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-lg); border:1px solid var(--c-border-strong); background:var(--c-surface); box-shadow:var(--sh-sm); color:var(--c-text2); }

.sheet { position:absolute; left:0; right:0; top:15%; bottom:58px; background:#fff; border-radius:22px 22px 0 0;
  border:1px solid var(--c-border); box-shadow:0 -8px 32px rgba(15,23,42,.12); display:flex; flex-direction:column; overflow:hidden; }
.handle { display:flex; justify-content:center; padding:9px 0 5px; flex-shrink:0; }
.handle-bar { width:40px; height:4px; border-radius:99px; background:#e2e8f0; }
.shead { display:flex; align-items:center; gap:8px; padding:0 16px 10px; flex-shrink:0; }
.shead-title { font-size:15px; font-weight:700; color:var(--c-text); }
.shead-sum { margin-left:auto; font-size:12px; color:var(--c-tertiary); font-weight:600; }
.stabs { display:flex; margin:0 16px 8px; background:var(--c-bg2); border-radius:12px; padding:3px; flex-shrink:0; }
.stab { flex:1; border:none; background:transparent; border-radius:10px; padding:8px 0; font-size:13px; font-weight:600; color:var(--c-muted); font-family:inherit; }
.stab.active { background:#fff; color:var(--c-text); font-weight:700; box-shadow:var(--sh-sm); }
.scontent { flex:1; min-height:0; overflow:hidden; padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; position:relative; }

.pill { display:flex; align-items:center; gap:8px; border:1.5px solid var(--c-border-strong); border-radius:99px; padding:4px 6px 4px 14px; background:#fff; flex-shrink:0; }
.pill input { flex:1; min-width:0; border:none; outline:none; background:transparent; font:inherit; font-size:13.5px; padding:8px 0; color:var(--c-tertiary); }
.pill-go { width:36px; height:36px; border:none; border-radius:99px; background:var(--c-primary); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* 하나로 합친 요약줄 — 범위·반경·정렬·결과수를 한 줄에, 필터는 버튼 하나로 */
.summary-row { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.summary-text { flex:1; min-width:0; font-size:12.5px; font-weight:600; color:var(--c-text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.filter-btn { flex-shrink:0; display:inline-flex; align-items:center; gap:5px; padding:8px 12px; border:1.5px solid var(--c-primary);
  border-radius:99px; background:var(--c-primary); color:#fff; font-size:12.5px; font-weight:700; }
.filter-badge { background:#facc15; color:#78350f; border-radius:99px; width:16px; height:16px; font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
.sort-btn { flex-shrink:0; display:inline-flex; align-items:center; gap:5px; padding:8px 10px; border:1.5px solid var(--c-border-strong);
  border-radius:99px; background:#fff; color:var(--c-text2); font-size:12.5px; font-weight:600; }

.cat-pills { display:flex; flex-wrap:nowrap; gap:6px; flex-shrink:0; overflow-x:auto; }
.cat-pill { flex-shrink:0; border:1.5px solid var(--c-border-strong); border-radius:99px; background:#fff; color:var(--c-text2); padding:6px 12px; font-size:12px; font-weight:600; }
.cat-pill.active { color:#fff; }

.results { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:10px; position:relative; }
.rcard { display:flex; align-items:flex-start; gap:12px; border:1px solid var(--c-border); border-radius:14px; padding:11px 13px; background:#fff; flex-shrink:0; }
.rthumb { width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
.rbody { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.rname { font-size:14px; font-weight:700; color:var(--c-text); }
.rstats { font-size:12px; color:var(--c-muted); display:flex; align-items:center; gap:5px; }
.rrating { color:#b45309; font-weight:600; }
.pinbtn { flex-shrink:0; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border-radius:99px; border:1.5px solid #99f6e4; background:#f0fdfa; color:#0d9488; }
.fade-cut { position:absolute; left:0; right:0; bottom:0; height:40px; background:linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.96) 70%); pointer-events:none; }

.tabbar { position:absolute; left:0; right:0; bottom:0; height:58px; display:flex; background:#fff; border-top:1px solid var(--c-border); box-shadow:0 -4px 14px rgba(15,23,42,.06); padding:6px 6px; z-index:6; }
.tabbar-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--c-text2); font-size:10.5px; font-weight:600; }
.tabbar-btn.active { color:var(--c-amber); }

/* 필터 버튼을 눌렀을 때 뜨는 시트 — 개념 설명용 인셋 */
.filter-sheet-inset { position:absolute; right:-172px; top:100px; width:250px; background:#fff; border-radius:16px; border:1px solid var(--c-border-strong);
  box-shadow:0 16px 40px rgba(15,23,42,.22); padding:14px; z-index:30; }
.filter-sheet-inset-title { font-size:12px; font-weight:800; color:var(--c-tertiary); letter-spacing:.04em; margin-bottom:8px; }
.mini-row { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
.mini-chip { font-size:11px; font-weight:600; padding:4px 8px; border-radius:99px; border:1px solid var(--c-border-strong); color:var(--c-text2); background:#fff; }
.mini-chip.active { background:var(--c-primary); color:#fff; border-color:var(--c-primary); }
.mini-apply { width:100%; border:none; background:#facc15; color:#1f2937; border-radius:99px; padding:9px 0; font-size:12.5px; font-weight:800; font-family:inherit; }
.pointer-line { position:absolute; z-index:29; border-top:2px dashed #cbd5e1; }
</style>
</helmet>
