<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root {
  --c-primary:#0f172a; --c-accent:#facc15; --c-accent-soft:#fffbeb; --c-amber:#a16207;
  --c-text:#0f172a; --c-text2:#475569; --c-muted:#64748b; --c-tertiary:#94a3b8;
  --c-border:rgba(15,23,42,.08); --c-border-strong:rgba(15,23,42,.14); --c-bg2:#f1f5f9; --c-surface:#fff;
  --r-sm:8px; --r-lg:14px; --r-pill:99px;
  --sh-sm:0 1px 3px rgba(15,23,42,.1); --sh-panel:0 8px 32px rgba(15,23,42,.12);
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Instrument Sans','Noto Sans KR',system-ui,sans-serif; }
a { color:#ca8a04; } a:hover { color:#a16207; }
.phone { position:relative; width:390px; height:844px; overflow:hidden; background:#eef3f0; }
.map-bg { position:absolute; inset:0; background:
  radial-gradient(ellipse 480px 340px at 74% 20%, rgba(196,225,214,.9), transparent 60%),
  radial-gradient(ellipse 420px 300px at 12% 50%, rgba(206,232,221,.85), transparent 55%),
  linear-gradient(160deg,#e3efe8 0%,#dcebe3 40%,#d7e7de 100%); }

.top { position:absolute; left:14px; right:14px; top:14px; z-index:5; display:flex; flex-direction:column; gap:8px; }
.top-row1 { display:flex; gap:8px; align-items:center; }
.trip-chip { flex:1; min-width:0; display:flex; align-items:center; gap:4px; background:#fff; border:1px solid var(--c-border);
  border-radius:var(--r-pill); padding:10px 8px 10px 16px; box-shadow:var(--sh-panel); }
.trip-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; color:var(--c-text); }
.top-row2 { display:flex; align-items:center; gap:8px; }
.days { flex:1; min-width:0; display:flex; gap:6px; overflow:hidden; }
.daytab { flex-shrink:0; border:none; border-radius:var(--r-pill); padding:7px 14px; font-size:12.5px; font-weight:600;
  background:rgba(255,255,255,.94); color:var(--c-muted); box-shadow:var(--sh-sm); white-space:nowrap; font-family:inherit; }
.daytab.active { background:var(--c-primary); color:#fff; }
.tools { flex-shrink:0; display:flex; gap:6px; }
.tool-btn { flex-shrink:0; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-lg); border:1px solid var(--c-border-strong); background:var(--c-surface); box-shadow:var(--sh-sm); color:var(--c-text2); }

.sheet { position:absolute; left:0; right:0; top:15%; bottom:58px; background:#fff; border-radius:22px 22px 0 0;
  border:1px solid var(--c-border); box-shadow:0 -8px 32px rgba(15,23,42,.12); display:flex; flex-direction:column; overflow:hidden; }
.handle { display:flex; justify-content:center; padding:9px 0 5px; flex-shrink:0; }
.handle-bar { width:40px; height:4px; border-radius:99px; background:#e2e8f0; }

/* 스크롤로 접힌 상태: 탭·제목은 슬림하게, 검색은 아이콘 알약으로, 필터·정렬은 한 줄 스티키 바로 */
.stabs-slim { display:flex; align-items:center; gap:10px; padding:2px 16px 8px; flex-shrink:0; }
.stab-slim { border:none; background:transparent; font-size:12.5px; font-weight:600; color:var(--c-muted); font-family:inherit; padding:4px 0; }
.stab-slim.active { color:var(--c-text); font-weight:800; border-bottom:2px solid var(--c-primary); }
.stab-slim-count { margin-left:auto; font-size:11.5px; color:var(--c-tertiary); font-weight:600; }

.sticky-bar { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid var(--c-border);
  box-shadow:0 6px 12px -8px rgba(15,23,42,.18); position:relative; z-index:2; }
.mini-search { flex-shrink:0; width:34px; height:34px; border-radius:99px; border:1.5px solid var(--c-border-strong); background:#fff;
  display:flex; align-items:center; justify-content:center; color:var(--c-text2); }
.sticky-text { flex:1; min-width:0; font-size:12px; font-weight:600; color:var(--c-text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sticky-filter { flex-shrink:0; display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border:1px solid var(--c-border-strong);
  border-radius:99px; background:#fff; font-size:12px; font-weight:600; color:var(--c-text); }

.scontent { flex:1; min-height:0; overflow:hidden; padding:10px 16px 16px; display:flex; flex-direction:column; gap:10px; position:relative; }
.results { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:10px; position:relative; }
.rcard { display:flex; align-items:flex-start; gap:12px; border:1px solid var(--c-border); border-radius:14px; padding:11px 13px; background:#fff; flex-shrink:0; }
.rthumb { width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
.rbody { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.rname { font-size:14px; font-weight:700; color:var(--c-text); }
.rstats { font-size:12px; color:var(--c-muted); display:flex; align-items:center; gap:5px; }
.rrating { color:#b45309; font-weight:600; }
.pinbtn { flex-shrink:0; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border-radius:99px; border:1.5px solid #99f6e4; background:#f0fdfa; color:#0d9488; }
.fade-cut { position:absolute; left:0; right:0; bottom:0; height:36px; background:linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.96) 70%); pointer-events:none; }

.tabbar { position:absolute; left:0; right:0; bottom:0; height:58px; display:flex; background:#fff; border-top:1px solid var(--c-border); box-shadow:0 -4px 14px rgba(15,23,42,.06); padding:6px 6px; z-index:6; }
.tabbar-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--c-text2); font-size:10.5px; font-weight:600; }
.tabbar-btn.active { color:var(--c-amber); }

.scroll-hint { position:absolute; left:50%; top:186px; transform:translateX(-50%); z-index:20; display:flex; align-items:center; gap:6px;
  background:rgba(15,23,42,.86); color:#fff; padding:7px 14px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; }
</style>
</helmet>

<div class="phone">
  <div class="map-bg"></div>

  <div class="top">
    <div class="top-row1">
      <div class="trip-chip">
        <span class="trip-title">춘천여행</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
    <div class="top-row2">
      <div class="days">
        <button class="daytab active">1일차·16</button>
        <button class="daytab">2일차·3</button>
        <button class="daytab">+ 일차</button>
      </div>
      <div class="tools">
        <button class="tool-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/><path d="M21 21L16.65 16.65"/></svg></button>
        <button class="tool-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 13.74a2 2 0 0 1-2 0L2.5 8.87a1 1 0 0 1 0-1.74L11 2.26a2 2 0 0 1 2 0l8.5 4.87a1 1 0 0 1 0 1.74z"/><path d="m20 14.285 1.5.845a1 1 0 0 1 0 1.74L13 21.74a2 2 0 0 1-2 0l-8.5-4.87a1 1 0 0 1 0-1.74l1.5-.845"/></svg></button>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="handle"><span class="handle-bar"></span></div>

    <div class="stabs-slim">
      <button class="stab-slim active">검색</button>
      <button class="stab-slim">일정 16</button>
      <span class="stab-slim-count">결과 15개</span>
    </div>

    <div class="sticky-bar">
      <div class="mini-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/><path d="M21 21L16.65 16.65"/></svg></div>
      <span class="sticky-text">지도 주변 5km · 맛집 · 거리순</span>
      <button class="sticky-filter">필터<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>

    <div class="scontent">
      <div class="results">
        <div class="rcard">
          <div class="rthumb" style="background:#fde68a">🐟</div>
          <div class="rbody"><div class="rname">어촌밥상 생선조림전문점</div><div class="rstats"><span class="rrating">★ 4.3</span>· 3 reviews · 113m</div></div>
          <button class="pinbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M16 18h6"/><path d="M19 15v6"/></svg></button>
        </div>
        <div class="rcard">
          <div class="rthumb" style="background:#fed7aa">🍜</div>
          <div class="rbody"><div class="rname">더계식당</div><div class="rstats"><span class="rrating">★ 4.5</span>· 12 reviews · 180m</div></div>
          <button class="pinbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M16 18h6"/><path d="M19 15v6"/></svg></button>
        </div>
        <div class="rcard">
          <div class="rthumb" style="background:#fecaca">🍢</div>
          <div class="rbody"><div class="rname">춘천닭갈비 본점</div><div class="rstats"><span class="rrating">★ 4.7</span>· 320 reviews · 240m</div></div>
          <button class="pinbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M16 18h6"/><path d="M19 15v6"/></svg></button>
        </div>
        <div class="rcard">
          <div class="rthumb" style="background:#fde68a">🥘</div>
          <div class="rbody"><div class="rname">온의칼국수</div><div class="rstats"><span class="rrating">★ 5.0</span>· 88 reviews · 310m</div></div>
          <button class="pinbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M16 18h6"/><path d="M19 15v6"/></svg></button>
        </div>
        <div class="rcard">
          <div class="rthumb" style="background:#e0f2fe">🍢</div>
          <div class="rbody"><div class="rname">춘천 숯불닭갈비 명가</div><div class="rstats"><span class="rrating">★ 4.2</span>· 47 reviews · 390m</div></div>
          <button class="pinbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M16 18h6"/><path d="M19 15v6"/></svg></button>
        </div>
        <div class="fade-cut"></div>
      </div>
    </div>
  </div>

  <div class="scroll-hint">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    위로 스크롤하면 검색·필터 다시 펼쳐짐
  </div>
</div>
</x-dc>
</body>
</html>
