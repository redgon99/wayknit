<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root {
  --c-primary:#0f172a; --c-primary-soft:#fef9c3; --c-accent:#facc15; --c-accent-hover:#eab308;
  --c-amber:#a16207; --c-link:#ca8a04; --c-text:#0f172a; --c-text2:#475569; --c-muted:#64748b;
  --c-tertiary:#94a3b8; --c-border:rgba(15,23,42,.08); --c-border-strong:rgba(15,23,42,.14);
  --c-bg:#fafaf8; --c-bg2:#f1f5f9; --c-surface:#fff;
  --r-sm:8px; --r-md:12px; --r-lg:14px; --r-xl:18px; --r-panel:20px; --r-pill:99px;
  --sh-sm:0 1px 3px rgba(15,23,42,.1); --sh-panel:0 8px 32px rgba(15,23,42,.12);
  --sh-dock:0 12px 40px rgba(15,23,42,.16);
}

* { box-sizing: border-box; }
body { margin:0; font-family:'Instrument Sans','Noto Sans KR',system-ui,sans-serif; }
.phone { position:relative; width:390px; height:844px; overflow:hidden; background:var(--c-bg); }
.map-bg { position:absolute; inset:0;
  background:
    radial-gradient(ellipse 500px 380px at 72% 30%, rgba(196,225,214,.9), transparent 60%),
    radial-gradient(ellipse 420px 340px at 20% 68%, rgba(206,232,221,.85), transparent 55%),
    linear-gradient(160deg,#e3efe8 0%,#dcebe3 40%,#d7e7de 100%);
}
.map-road { position:absolute; stroke:#eef5f0; stroke-width:9; fill:none; stroke-linecap:round; opacity:.9; }
.map-road2 { position:absolute; stroke:#f6b13b; stroke-width:4; fill:none; stroke-linecap:round; opacity:.85; }
.map-label { position:absolute; font-size:10px; color:#7c9a8c; font-weight:600; white-space:nowrap; }
.map-poi { position:absolute; width:7px; height:7px; border-radius:50%; background:#c3d9cd; box-shadow:0 0 0 2px #fff; }
.icon-btn { display:flex; align-items:center; justify-content:center; border:1px solid var(--c-border);
  background:#fff; box-shadow:var(--sh-panel); color:var(--c-text2); flex-shrink:0; cursor:pointer; }
.presence { display:inline-flex; align-items:center; }
.presence-av { width:24px; height:24px; margin-left:-6px; border:2px solid #fff; border-radius:50%;
  color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.presence-av:first-child { margin-left:0; }
.daytab { border:none; border-radius:var(--r-pill); padding:7px 14px; font-size:12.5px; font-weight:600;
  background:rgba(255,255,255,.94); color:var(--c-muted); box-shadow:var(--sh-sm); white-space:nowrap; font-family:inherit; }
.daytab.active { background:var(--c-primary); color:#fff; }
.sheet { position:absolute; left:0; right:0; bottom:58px; background:#fff; border-radius:22px 22px 0 0;
  border:1px solid var(--c-border); box-shadow:0 -8px 32px rgba(15,23,42,.12); display:flex; flex-direction:column; overflow:hidden; }
.sheet-handle { display:flex; justify-content:center; padding:9px 0 5px; flex-shrink:0; }
.sheet-handle-bar { width:40px; height:4px; border-radius:99px; background:#e2e8f0; }
.sheet-head { display:flex; align-items:center; gap:8px; padding:0 16px 10px; flex-shrink:0; }
.sheet-title { font-size:15px; font-weight:700; color:var(--c-text); }
.sheet-sub { margin-left:auto; font-size:12px; color:var(--c-tertiary); font-weight:600; }
.sheet-tabs { display:flex; margin:0 16px 10px; background:var(--c-bg2); border-radius:12px; padding:3px; flex-shrink:0; }
.sheet-tab { flex:1; border:none; background:transparent; border-radius:10px; padding:8px 0; font-size:13px;
  font-weight:600; color:var(--c-muted); font-family:inherit; }
.sheet-tab.active { background:#fff; color:var(--c-text); font-weight:700; box-shadow:var(--sh-sm); }
.sheet-body { padding:0 16px 12px; overflow:hidden; flex:1; }
.pin-row { display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--c-border); }
.pin-num { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:12px; font-weight:700; flex-shrink:0; }
.pin-name { font-size:13.5px; font-weight:600; color:var(--c-text); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.pin-meta { display:flex; align-items:center; gap:3px; font-size:11px; font-weight:700; margin-top:2px; }
.pin-actions { display:flex; align-items:center; gap:10px; margin-left:auto; color:var(--c-tertiary); flex-shrink:0; }
.tabbar { position:absolute; left:0; right:0; bottom:0; height:58px; display:flex; background:#fff;
  border-top:1px solid var(--c-border); box-shadow:0 -4px 14px rgba(15,23,42,.06); padding:6px 6px; }
.tabbar-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--c-text2); font-size:10.5px; font-weight:600; }
.tabbar-btn.active { color:var(--c-amber); }
.badge-note { position:absolute; font-size:9.5px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;
  padding:3px 7px; border-radius:99px; color:#fff; }


</style>
</helmet>

    <div class="map-label" style="left:210px;top:230px">약사천</div>
    <div class="map-label" style="left:60px;top:320px">중앙시장</div>
    <div class="map-poi" style="left:266px;top:44px"></div>
    <div class="map-poi" style="left:158px;top:178px"></div>
    <div class="map-poi" style="left:220px;top:236px"></div>
  </div>

  <!-- 상단: 지도 위엔 최소한만 — presence·더보기 뿐. 검색은 시트 안으로 옮겼다 -->
  <div style="position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:flex-end;gap:8px;align-items:center;z-index:5">
    <span class="presence"><span class="presence-av" style="background:#ea580c">U</span><span class="presence-av" style="background:#7c3aed">U</span></span>

  </div>

  <div style="position:absolute;left:14px;right:14px;top:64px;display:flex;gap:6px;z-index:5">
    <button class="daytab active">1일차·16</button>
    <button class="daytab">+ 일차</button>
  </div>

  <!-- 지도 도구는 지도 소관으로 남겨 오른쪽 가장자리에 그대로 둔다 -->
  <button class="icon-btn" style="position:absolute;right:16px;top:108px;width:38px;height:38px;border-radius:13px;z-index:6">
    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M13 13.74a2 2 0 0 1-2 0L2.5 8.87a1 1 0 0 1 0-1.74L11 2.26a2 2 0 0 1 2 0l8.5 4.87a1 1 0 0 1 0 1.74z"/><path d="m20 14.285 1.5.845a1 1 0 0 1 0 1.74L13 21.74a2 2 0 0 1-2 0l-8.5-4.87a1 1 0 0 1 0-1.74l1.5-.845"/></svg>
  </button>
  <button class="icon-btn" style="position:absolute;right:16px;top:152px;width:38px;height:38px;border-radius:13px;z-index:6;color:#fff;background:var(--c-primary)">
    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32 32 0 0 0 .824-.738"/><path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M16 18h6"/><path d="M19 15v6"/></svg>
  </button>

  <!-- 하단 시트: 탭 자체가 없다. 검색이 시트의 첫 줄이고, 그 아래로 핀·동선이 이어진다 -->
  <div class="sheet" style="top:326px">
    <div class="sheet-handle"><span class="sheet-handle-bar"></span></div>
    <div class="sheet-body" style="display:flex;flex-direction:column;padding-top:2px">

      <div style="display:flex;align-items:center;gap:10px;background:var(--c-bg2);border-radius:99px;
        padding:11px 16px;margin-bottom:14px">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--c-tertiary)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/><path d="M21 21L16.65 16.65"/></svg>
        <span style="font-size:13.5px;font-weight:600;color:var(--c-tertiary);flex:1">어디로 가시나요?</span>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:13.5px;font-weight:700;color:var(--c-text)">춘천여행 · 핀 16개</span>
        <span style="font-size:11.5px;font-weight:700;color:var(--c-tertiary)">1일차</span>
      </div>

      <div style="display:flex;align-items:center;gap:10px;background:var(--c-accent-soft);
        border:1px solid #fde68a;border-radius:14px;padding:11px 13px;margin-bottom:12px">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--c-amber)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M3 19a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><path d="M15 5a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/></svg>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:var(--c-text)">오늘 동선 · 4.2km · 48분</div>
        </div>
        <button style="border:none;background:#fff;border-radius:99px;padding:7px 12px;font-size:11.5px;
          font-weight:700;color:var(--c-amber);font-family:inherit;box-shadow:var(--sh-sm)">다시 짜기</button>
      </div>

      <div class="pin-row">
      
      <span class="pin-num" style="background:#ec4899">1</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/></svg>
      <div style="min-width:0;flex:1">
        <div class="pin-name">향토숯불닭갈비집</div>
        
      </div>
      <div class="pin-actions"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-7a2 2 0 0 1 2 -2z"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h-2v-6l2-5h9l4 5h1a2 2 0 0 1 2 2v4h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
    </div>
      <div class="pin-row">
      
      <span class="pin-num" style="background:#f97316">3</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/></svg>
      <div style="min-width:0;flex:1">

      </div>
      <div class="pin-actions"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h-2v-6l2-5h9l4 5h1a2 2 0 0 1 2 2v4h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
    </div>
    </div>
  </div>

  <!-- 하단 내비 — A안과 같은 통일안: 메뉴 하나로 -->

    <div class="tabbar-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/></svg>시나리오</div>
