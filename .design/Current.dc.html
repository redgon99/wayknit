<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    :root{
      --ink:#0f172a; --ink2:#475569; --ink3:#64748b; --ink4:#94a3b8;
      --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.14);
      --bg:#fafaf8; --bg2:#f1f5f9; --amber:#a16207; --accent:#facc15;
      --r-sm:8px; --r-md:12px; --r-panel:20px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Instrument Sans','Noto Sans KR',system-ui,sans-serif;
      background:#d8e9ee;color:var(--ink);-webkit-font-smoothing:antialiased}
    a{color:#ca8a04}a:hover{color:#a16207}
  </style>
</helmet>

<div style="width:400px;height:800px;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 45%), #d8e9ee">

  <div style="width:360px;height:760px;background:#fff;border:1px solid rgba(15,23,42,.12);
    border-radius:20px;box-shadow:0 2px 8px rgba(15,23,42,.06),0 12px 36px rgba(15,23,42,.14);
    display:flex;flex-direction:column;overflow:hidden">

    <!-- header -->
    <div style="padding:14px 18px;border-bottom:.5px solid var(--line);display:flex;
      align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <div>
          <div style="font-size:14px;font-weight:500;line-height:1.2">여행 자료</div>
          <div style="font-size:11px;color:var(--ink2);margin-top:2px">춘천여행가자 · 6개</div>
        </div>
      </div>
      <button style="font-size:11px;padding:5px 10px;border:.5px solid var(--line);border-radius:8px;
        background:transparent;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;font-family:inherit">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 12 5 4 5-4"/><path d="M4 21h16"/></svg>
        보내기
      </button>
    </div>

    <!-- compose: dropzone + textarea + save  (두 개가 세로로 쌓인다) -->
    <div style="padding:10px 14px;border-bottom:.5px solid var(--line);display:flex;flex-direction:column;gap:10px">
      <div style="min-height:72px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;
        background:var(--bg);color:var(--ink2);font-size:11px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
        <span>사진·문서 파일을 끌어다 놓거나 클릭하세요</span>
      </div>
      <textarea style="font-size:12px;line-height:1.45;border:1.5px solid #0f172a;border-radius:8px;padding:8px;
        min-height:64px;background:#fff;color:var(--ink);font-family:inherit;resize:none"
        placeholder="메모·일정 메모를 입력하고 저장하세요..."></textarea>
      <button style="align-self:flex-end;font-size:11px;padding:6px 12px;border-radius:8px;border:none;
        background:#94a3b8;color:#fff;display:inline-flex;align-items:center;gap:4px;font-family:inherit">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7"/></svg>
        저장
      </button>
    </div>

    <!-- filters: 두 줄로 접힌다 -->
    <div style="padding:8px 14px;border-bottom:.5px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center">
      <div style="display:inline-flex;border:.5px solid var(--line);border-radius:8px;overflow:hidden;margin-right:4px">
        <div style="width:30px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--bg2)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <div style="width:30px;height:28px;display:flex;align-items:center;justify-content:center;border-left:.5px solid var(--line)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </div>
      </div>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid rgba(15,23,42,.22);background:var(--bg2)">전체</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">텍스트</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">사진</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">파일</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">1일차</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">2일차</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">3일차</span>
      <span style="font-size:10px;padding:4px 8px;border-radius:8px;border:.5px solid var(--line);color:var(--ink2)">4일차</span>
      <div style="margin-left:auto;font-size:10px;padding:5px 8px;border-radius:8px;border:.5px solid var(--line);
        background:var(--bg);color:var(--ink2);display:flex;align-items:center;gap:14px">
        모든 장소 <span style="color:#94a3b8">▾</span>
      </div>
    </div>

    <!-- body -->
    <div style="flex:1;overflow:hidden;padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start">

      <div style="display:flex;flex-direction:column;gap:6px;border:.5px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)">
        <div style="aspect-ratio:4/3;border:.5px solid var(--line);border-radius:8px;overflow:hidden;
          background:linear-gradient(150deg,#3f5c43,#26402c 60%,#1c2f21)"></div>
        <div style="font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">스크린샷 2026-09-08 19…</div>
        <div style="display:flex;gap:6px">
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">4일차 <span style="color:#94a3b8">▾</span></div>
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">장소 없… <span style="color:#94a3b8">▾</span></div>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v13h12V7"/></svg>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;border:.5px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)">
        <div style="aspect-ratio:4/3;border:.5px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;
          display:flex;align-items:center;justify-content:center">
          <div style="width:80%;height:70%;background:linear-gradient(120deg,#fde68a 0 38%,#fff 38%);border-radius:4px"></div>
        </div>
        <div style="font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">out-01-landing.png</div>
        <div style="display:flex;gap:6px">
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">3일차 <span style="color:#94a3b8">▾</span></div>
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">장소 없… <span style="color:#94a3b8">▾</span></div>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v13h12V7"/></svg>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;border:.5px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)">
        <div style="height:64px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4"/></svg>
        </div>
        <div style="font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">1. 모두의 창업 프로젝트 통…</div>
        <div style="font-size:10px;color:var(--ink4)">933.2 KB</div>
        <div style="font-size:10px;color:#a16207;font-weight:600">다운로드</div>
        <div style="display:flex;gap:6px">
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">3일차 <span style="color:#94a3b8">▾</span></div>
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">장소 없… <span style="color:#94a3b8">▾</span></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;border:.5px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)">
        <div style="aspect-ratio:4/3;border:.5px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;
          display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px">
          <div style="width:78%;height:44%;background:#cbd5e1;border-radius:6px 6px 3px 3px"></div>
        </div>
        <div style="font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">스크린샷 2026-08-26 135…</div>
        <div style="display:flex;gap:6px">
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">3일차 <span style="color:#94a3b8">▾</span></div>
          <div style="flex:1;min-width:0;font-size:10px;padding:4px 6px;border-radius:8px;border:.5px solid var(--line);background:#fff;display:flex;justify-content:space-between">장소 없… <span style="color:#94a3b8">▾</span></div>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
