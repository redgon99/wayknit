<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    :root{
      --ink:#0f172a; --ink2:#475569; --ink3:#64748b; --ink4:#94a3b8;
      --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.14);
      --bg:#fafaf8; --bg2:#f1f5f9; --amber:#a16207; --cream:#fffbeb; --soft:#fef9c3;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Instrument Sans','Noto Sans KR',system-ui,sans-serif;
      background:#d8e9ee;color:var(--ink);-webkit-font-smoothing:antialiased}
    a{color:#ca8a04}a:hover{color:#a16207}
    .seg{display:inline-flex;background:var(--bg2);border-radius:99px;padding:2px}
    .seg > span{font-size:11px;padding:5px 11px;border-radius:99px;color:var(--ink3);white-space:nowrap}
    .seg > span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08)}
    .menu{font-size:11px;color:var(--ink2);display:inline-flex;align-items:center;gap:3px;
      padding:5px 8px;border-radius:99px;white-space:nowrap}
    .tile{aspect-ratio:4/3;border-radius:12px;overflow:hidden;position:relative;background:var(--bg2)}
    .cap{font-size:11.5px;font-weight:500;line-height:1.35;margin-top:7px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .meta{font-size:10.5px;color:var(--ink4);margin-top:2px;display:flex;align-items:center;gap:4px}
    .dot{width:2px;height:2px;border-radius:50%;background:#cbd5e1;flex:0 0 auto}
    .more{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:8px;
      background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(15,23,42,.16);
      display:flex;align-items:center;justify-content:center}
    /* 공유받은 자료 배지 — 핀 작성자 배지(§14)와 같은 규칙:
       색은 이메일 해시, 글자는 이니셜, 내 것에는 붙지 않는다. */
    .who{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;color:#fff;
      font-size:10px;font-weight:700;letter-spacing:-.02em;
      box-shadow:0 0 0 1.5px rgba(255,255,255,.92), 0 1px 3px rgba(15,23,42,.28)}
  </style>
</helmet>

<div style="width:400px;height:800px;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 45%), #d8e9ee">

  <div style="width:360px;height:760px;background:#fff;border:1px solid rgba(15,23,42,.12);
    border-radius:20px;box-shadow:0 2px 8px rgba(15,23,42,.06),0 12px 36px rgba(15,23,42,.14);
    display:flex;flex-direction:column;overflow:hidden">

    <!-- header -->
    <div style="padding:16px 18px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div>
        <div style="font-size:15px;font-weight:600;line-height:1.2;letter-spacing:-.01em">여행 자료</div>
        <div style="font-size:11px;color:var(--ink4);margin-top:3px">춘천여행가자 · 6개</div>
      </div>
      <div style="display:flex;align-items:center;gap:2px">
        <div style="width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 12 5 4 5-4"/><path d="M4 21h16"/></svg>
        </div>
        <div style="width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </div>
      </div>
    </div>

    <!-- 한 줄 추가 바 : 드롭존·텍스트박스·저장버튼 3층을 하나로 -->
    <div style="padding:0 18px 12px;display:flex;gap:8px">
      <div style="flex:1;height:38px;border-radius:11px;background:var(--bg2);display:flex;align-items:center;
        justify-content:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
        사진·파일
      </div>
      <div style="flex:1;height:38px;border-radius:11px;background:var(--bg2);display:flex;align-items:center;
        justify-content:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-4-4L4 16z"/></svg>
        메모 쓰기
      </div>
    </div>

    <!-- 한 줄 필터 : 칩 8개를 세그먼트 + 메뉴 2개로 -->
    <div style="padding:0 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="seg">
        <span class="on">전체</span><span>사진</span><span>메모</span><span>파일</span>
      </div>
      <div style="display:flex;align-items:center;gap:1px">
        <div class="menu">일차<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="menu">장소<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
      </div>
    </div>

    <div style="height:.5px;background:var(--line);margin:0 18px"></div>

    <!-- body : 테두리 없는 카드, 사진이 주인공 -->
    <div style="flex:1;overflow:hidden;padding:14px 18px 0;display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;align-content:start">

      <!-- 메모 (공유받음) : 전체 폭, 크림 배경 -->
      <div style="grid-column:1 / -1;background:var(--cream);border-radius:14px;padding:12px 13px;position:relative">
        <div class="who" style="background:#7c3aed;top:11px;left:12px">U</div>
        <div style="font-size:11.5px;line-height:1.5;color:#713f12;white-space:pre-line;padding-left:28px">닭갈비 골목은 6시 전에 가야 자리 있음.
소양강 스카이워크는 우천시 폐쇄 — 전날 확인.</div>
        <div class="meta" style="margin-top:8px;padding-left:28px;color:#a16207;opacity:.8">
          <span>1일차</span><span class="dot" style="background:#d6be7a"></span><span>춘천 명동 닭갈비골목</span>
        </div>
      </div>

      <!-- 공유받은 사진 -->
      <div>
        <div class="tile" style="background:linear-gradient(150deg,#3f5c43,#26402c 60%,#1c2f21)">
          <div class="who" style="background:#7c3aed">U</div>
          <div class="more"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h.01"/><path d="M12 12h.01"/><path d="M19 12h.01"/></svg></div>
        </div>
        <div class="cap">스크린샷 2026-09-08</div>
        <div class="meta"><span>4일차</span><span class="dot"></span><span>장소 없음</span></div>
      </div>

      <!-- 내가 올린 것 : 배지 없음 -->
      <div>
        <div class="tile" style="background:#fff;border:.5px solid var(--line);display:flex;align-items:center;justify-content:center">
          <div style="width:82%;height:72%;background:linear-gradient(120deg,#fde68a 0 38%,#f8fafc 38%);border-radius:5px"></div>
        </div>
        <div class="cap">out-01-landing.png</div>
        <div class="meta"><span>3일차</span><span class="dot"></span><span>장소 없음</span></div>
      </div>

      <!-- 또 다른 사람이 올린 파일 -->
      <div>
        <div class="tile" style="background:var(--bg);display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:5px;border:.5px solid var(--line)">
          <div class="who" style="background:#0d9488">M</div>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.4"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4"/></svg>
          <span style="font-size:9.5px;color:var(--ink4);letter-spacing:.04em">PDF · 933 KB</span>
        </div>
        <div class="cap">모두의 창업 프로젝트 통합</div>
        <div class="meta"><span>3일차</span><span class="dot"></span><span style="color:var(--amber);font-weight:600">받기</span></div>
      </div>

      <!-- 내가 올린 것 : 배지 없음 -->
      <div>
        <div class="tile" style="background:#fff;border:.5px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px">
          <div style="width:76%;height:46%;background:#cbd5e1;border-radius:7px 7px 3px 3px"></div>
        </div>
        <div class="cap">스크린샷 2026-08-26</div>
        <div class="meta"><span>3일차</span><span class="dot"></span><span>장소 없음</span></div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
